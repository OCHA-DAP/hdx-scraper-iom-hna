notes: >
  This dataset contains results of the International Organization for
  Migration (IOM) Displacement Tracking Matrix (DTM) Household Needs
  Assessment (HNA), from the
  [DTM API](https://dtm.iom.int/data-and-analysis/dtm-api). The HNA surveys
  internally displaced, returnee and non-displaced households on
  demographics, reasons for displacement, food consumption and hunger, coping
  strategies, shelter, sanitation, health care barriers and priority needs.
  There is one resource per assessment year, with indicators aggregated by
  admin 2 and population group, and a data dictionary describing each
  indicator column.
